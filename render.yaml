services:
  - type: web
    name: ipl-with-friends
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://iplwithfriends.in,https://www.iplwithfriends.in
