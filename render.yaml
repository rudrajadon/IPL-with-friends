        sync: false
      - key: REACT_APP_CLERK_PUBLISHABLE_KEY
        value: pk_live_Y2xlcmsuaXBsd2l0aGZyaWVuZHMuaW4k
      - key: SKIP_PREFLIGHT_CHECK
        value: "true"
